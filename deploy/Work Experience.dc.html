<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0c; color: #e8e6e1; font-family: 'Courier Prime', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: #e04a2e; }
  .read-more { position: relative; display: inline-block; color: #e04a2e; background-image: linear-gradient(115deg, #e04a2e 35%, #fff 50%, #e04a2e 65%); background-size: 300% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; }
  .read-more:hover { animation: glossText 1.5s ease-in-out infinite; -webkit-text-fill-color: transparent; }
  @keyframes glossText { 0% { background-position: 140% 0; } 100% { background-position: -140% 0; } }
</style>
</helmet>
<div style="min-height: 100vh;">
  <a href="Portfolio.dc.html" onClick="{{ goHome }}" style="position: fixed; top: 24px; left: 24px; font-family: 'Courier Prime', monospace; font-style: italic; font-size: 12px; color: #6b6b70; letter-spacing: 0.05em; cursor: pointer;">← back to home</a>

  <div style="padding: 96px 24px 120px; text-align: center;">
    <div style="max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; align-items: center;">
      <div style="display: inline-block; background: #e04a2e; padding: 5px 12px 6px; font-family: 'Courier Prime', monospace; font-weight: 700; font-style: italic; font-size: 12px; color: #ffffff; letter-spacing: 0.02em; margin-bottom: 12px; opacity: {{ heroOpacity }}; transform: {{ heroTransform }}; transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1);">03 · work experience</div>
      <p style="font-family: 'Courier Prime', monospace; font-style: italic; font-size: 14px; color: #8a8a92; margin: 0 0 56px; opacity: {{ heroOpacity }}; transform: {{ heroTransform }}; transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1) 0.08s, transform 0.7s cubic-bezier(0.16,1,0.3,1) 0.08s;">a short, honest track record.</p>

      <div style="width: 100%; display: flex; flex-direction: column; gap: 40px; opacity: {{ heroOpacity }}; transform: {{ heroTransform }}; transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1) 0.16s, transform 0.7s cubic-bezier(0.16,1,0.3,1) 0.16s;">
        <sc-for list="{{ experiences }}" as="e" hint-placeholder-count="3">
          <div onClick="{{ e.onToggle }}" style="text-align: center; cursor: pointer;">
            <div style="font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 12px; color: #e04a2e; letter-spacing: 0.05em; margin-bottom: 8px;">{{ e.range }}</div>
            <div style="font-family: 'Courier Prime', monospace; font-weight: 700; font-style: italic; font-size: 18px; color: #e8e6e1; margin-bottom: 6px;">{{ e.roleLine }}</div>
            <p style="font-family: 'Courier Prime', monospace; font-size: 13px; line-height: 1.6; color: #8a8a92; margin: 0 auto; max-width: 440px;">{{ e.desc }}</p>
            <div style="max-height: {{ e.moreMaxHeight }}px; opacity: {{ e.moreOpacity }}; overflow: hidden; transition: max-height 0.5s cubic-bezier(0.16,1,0.3,1), opacity 0.45s ease;">
              <p style="font-family: 'Courier Prime', monospace; font-style: italic; font-size: 13px; line-height: 1.6; color: #cfcdc7; margin: 12px auto 0; max-width: 440px;">{{ e.more }}</p>
            </div>
            <div class="read-more" style="font-family: 'Courier Prime', monospace; font-style: italic; font-size: 11px; margin-top: 10px; letter-spacing: 0.05em;">{{ e.toggleLabel }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { loaded: false, expandedExp: {} };
  componentDidMount() {
    requestAnimationFrame(() => setTimeout(() => this.setState({ loaded: true }), 30));
  }
  componentWillUnmount() {
    clearTimeout(this._navTimer);
  }
  goHome(e) {
    e.preventDefault();
    this.setState({ loaded: false });
    clearTimeout(this._navTimer);
    this._navTimer = setTimeout(() => { window.location.href = 'Portfolio.dc.html'; }, 360);
  }
  toggleExp(i) {
    this.setState((s) => ({ expandedExp: { ...s.expandedExp, [i]: !s.expandedExp[i] } }));
  }
  renderVals() {
    return {
      heroOpacity: this.state.loaded ? 1 : 0,
      heroTransform: this.state.loaded ? 'translateY(0)' : 'translateY(14px)',
      goHome: (e) => this.goHome(e),
      experiences: [
        { range: 'INCOMING', roleLine: 'software engineer intern / pwc - tax innovation & delivery experience',
          desc: 'joining the tax innovation & delivery experience team to build ai tools that modernizes tax workflows.',
          more: 'starting soon \u2014 details to come as the role kicks off. focused on internal automation tooling and applying ai/ml to a large, process-heavy domain.' },
        { range: '05/2026 - present',  roleLine: 'software developer intern / IBM - zAIOps',
          desc: 'built the system that allows IBM\'s internal AI agent to operate ServiceNow — ticketing, change requests, root cause analysis, etc.',
          more: 'designed the tool-calling layer connecting the internal AI agent to ServiceNow, letting it triage tickets, draft change requests, and run root-cause analysis without a human in the loop for routine cases.' },
        { range: '09/2025 - 05/2026', roleLine: 'student technician / UT enterprise technologies',
          desc: 'deployed production APIs serving 70,000+ users, built the privacy layer anonymizing wi-fi client data across 40+ buildings',
          more: 'shipped and maintained production APIs across UT\u2019s network infrastructure, and built the anonymization layer that let the team analyze wi-fi usage patterns campus-wide without exposing individual client data.' },
      ].map((e, i) => {
        const expanded = !!this.state.expandedExp[i];
        return {
          ...e, idx: i, onToggle: () => this.toggleExp(i), expanded,
          toggleLabel: expanded ? 'show less \u2212' : 'read more +',
          moreMaxHeight: expanded ? 220 : 0,
          moreOpacity: expanded ? 1 : 0,
        };
      }),
    };
  }
}
</script>
</body>
</html>
